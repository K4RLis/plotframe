<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Plotframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#eceef1;--panel:#ffffff;--fg:#1b1e23;--fg2:#5b616a;--line:#e3e5e9;--field:#f2f3f5;--accent:#0b87e0;--on-accent:#ffffff;--danger:#d03b3b;--shadow:0 8px 28px rgba(22,28,38,.14),0 1px 3px rgba(22,28,38,.10)}
@media (prefers-color-scheme: dark){:root{--bg:#141619;--panel:#1f2226;--fg:#e9ebee;--fg2:#a6acb4;--line:#2f3338;--field:#292c31;--accent:#3a9ff0;--danger:#ef6b6b;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg) radial-gradient(circle,rgba(127,134,145,.28) 1px,transparent 1.3px) 0 0/24px 24px;color:var(--fg);font:13px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:min(360px,100%);background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:24px}
.mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
h1{margin:0 0 4px;font-size:17px;font-weight:600}
p{margin:0 0 18px;color:var(--fg2)}
label{display:block;font-size:12px;color:var(--fg2);margin-bottom:6px}
input[type=password]{width:100%;height:36px;border-radius:6px;border:1px solid transparent;background:var(--field);color:var(--fg);padding:0 10px;font:inherit;outline:none}
input[type=password]:focus{border-color:var(--accent);background:var(--panel)}
.rm{display:flex;align-items:center;gap:8px;margin:12px 0 16px;cursor:pointer}
.rm input{accent-color:var(--accent);margin:0}
button{width:100%;height:36px;border:0;border-radius:6px;background:var(--accent);color:var(--on-accent);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{margin:12px 0 0;color:var(--danger);min-height:1.45em}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="7.5" width="2.6" height="6" rx=".8"/><rect x="6.7" y="3" width="2.6" height="10.5" rx=".8"/><rect x="10.4" y="9.3" width="2.6" height="4.2" rx=".8"/></svg></div>
  <h1>Plotframe</h1>
  <p>This board is locked. Enter the password to open it.</p>
  <form id="f" novalidate>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <label class="rm" for="rm"><input type="checkbox" id="rm"> Remember on this device</label>
    <button id="go" type="submit">Unlock</button>
    <p id="err" role="alert"></p>
  </form>
</main>

  var KEY_STORE = 'plotframe.unlock.' + P.s.slice(0, 12);
  var u8 = function (s) { return Uint8Array.from(atob(s), function (ch) { return ch.charCodeAt(0); }); };
  var err = document.getElementById('err'), btn = document.getElementById('go');
  function show(html) { document.open(); document.write(html); document.close(); }
  function decryptWith(key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.i) }, key, u8(P.c)).then(function (buf) { return new TextDecoder().decode(buf); }); }

  function writeStore(v) { try { if (v) localStorage.setItem(KEY_STORE, v); else localStorage.removeItem(KEY_STORE); } catch (e) {} }
